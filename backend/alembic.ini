# Alembic Configuration

[alembic]
# path to migration scripts
sqlalchemy.url =

# use the below lines to set up logging with Python's logging module
# note that when using the above python logging, it is critical that the
# /etc/sqlalchemy.py point to the actual location of your logging configuration
# and that logging module is loaded from the environment, so that the logging
# configuration can be read by the alembic script before the database is accessed.
#sqlalchemy.url: driver://user:pass@localhost/dbname

# A logfile to write to, as specified by FileHandler filename.
# logfile = .log

# A logging level to emit warnings at. See logging documentation for level
# names.
sqlalchemy.echo =

# When set to True, SQL emitted as result of the operations in revision scripts
# will be printed to the console. When False, those SQL statements will not be
# printed. Defaults to False if not specified.
sqlalchemy.echo_pool = false

# The maximum amount of time to wait before giving up on getting a
# connection from the pool. This is only used if sqlalchemy.poolclass is set to
# QueuePool, and only applies in the case that there are more checkins
# happening than there are possible connections to the database. This value
# represents seconds. 100.0 seconds is the default.
sqlalchemy.pool_timeout = 10

# The QueuePool strategy has two concepts for dealing with stale connections:

# 1. recycle_time - recycled connections go away.
sqlalchemy.pool_recycle = 3600

# 2. pool_pre_ping - performed on all connections pulled from the
# pool:

sqlalchemy.pool_pre_ping = true

# Logging configuration
[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
